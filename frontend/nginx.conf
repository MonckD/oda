# DEBUT DE CONTENEURISATION
# ==============================================
# Config nginx du frontend :
#  - sert l'app React (routeur → index.html)
#  - redirige /api vers le service "backend" du compose
#    (dans Docker, "backend" est le nom du conteneur)
# ==============================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les appels /api/... partent vers le backend (port 3000)
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Tout le reste = l'app React (gère elle-même ses routes)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# FIN DE CONTENEURISATION
